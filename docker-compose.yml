services:
  db:
    image: postgres:16-alpine
    container_name: terminal_postgres
    # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD src/.env faylidan olinadi
    env_file:
      - ./src/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: terminal_redis
    env_file:
      - ./src/.env
    # Parol src/.env dagi REDIS_PASSWORD dan olinadi. Host portiga ochilmaydi,
    # konteynerlar unga `redis` nomi orqali ichki tarmoqda ulanadi.
    command: sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: terminal_django_web
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./src:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./src/.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: always

  celery:
    build: .
    container_name: terminal_celery_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - ./src:/app
    env_file:
      - ./src/.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: always

volumes:
  redis_data:
  static_volume:
  media_volume:
  postgres_data:
